name: Release quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Check repository terminology
        shell: pwsh
        run: ./scripts/check-repository-terminology.ps1

      - name: Run release checks
        run: pnpm check

      - name: Run AI evaluation release gate
        run: pnpm evaluate:ai

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
